name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.x'

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod tidy

    - name: Build
      run: make build

    - name: Test
      run: make test
